server {
    listen ${PORT};

    # Increase large client header buffers
    large_client_header_buffers 4 64k;

    location / {
        proxy_pass ${OLLAMA_URL};
        # Set Host header to the upstream for Cloud Run routing
        proxy_set_header Host ${OLLAMA_HOST_HEADER};
        proxy_set_header X-Real-IP $remote_addr;
        # Clear X-Forwarded-For to avoid loops/massive headers in Cloud Run
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Increase buffers for large headers (X-Forwarded-For etc)
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # SNI support for HTTPS upstreams
        proxy_ssl_server_name on;

        # Add a custom header to show it went through the proxy
        add_header X-AI-Proxy "LearnSphere-Sidecar";
    }
}
