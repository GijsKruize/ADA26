version: '3.8'

services:
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama-pull-model:
    image: curlimages/curl:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ "sh", "-c", "curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"qwen2.5:7b\"}'" ]

  ai-proxy:
    image: nginx:alpine
    ports:
      - "11435:80"
    volumes:
      - ./infra/gateway/ai-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      ollama:
        condition: service_healthy

  course_service:
    build:
      context: ./services/course_service
    ports:
      - "8001:8000"
    environment:
      - OLLAMA_BASE_URL=http://ai-proxy
      - OLLAMA_MODEL=qwen2.5:7b
      - LOCAL_MODE=true
    volumes:
      - ./shared:/app/shared:ro

  assessment_service:
    build:
      context: ./services/assessment_service
    ports:
      - "8002:8000"
    environment:
      - OLLAMA_BASE_URL=http://ai-proxy
      - OLLAMA_MODEL=qwen2.5:7b
      - LOCAL_MODE=true
    volumes:
      - ./shared:/app/shared:ro

  learning_profile_service:
    build:
      context: ./services/learning_profile_service
    ports:
      - "8003:8000"
    environment:
      - OLLAMA_BASE_URL=http://ai-proxy
      - OLLAMA_MODEL=qwen2.5:7b
      - LOCAL_MODE=true
    volumes:
      - ./shared:/app/shared:ro

  auto_grading_agent:
    build:
      context: ./agents/auto_grading_agent
    ports:
      - "8004:8000"
    environment:
      - OLLAMA_BASE_URL=http://ai-proxy
      - OLLAMA_MODEL=qwen2.5:7b
      - ASSESSMENT_MCP_SERVER_URL=http://assessment_mcp_server:8000
      - LOCAL_MODE=true
    volumes:
      - ./shared:/app/shared:ro

  recommender_agent:
    build:
      context: ./agents/recommender_agent
    ports:
      - "8005:8000"
    environment:
      - OLLAMA_BASE_URL=http://ai-proxy
      - OLLAMA_MODEL=qwen2.5:7b
      - LEARNING_COURSE_MCP_SERVER_URL=http://learning_course_mcp_server:8000
      - LOCAL_MODE=true
    volumes:
      - ./shared:/app/shared:ro

  assessment_mcp_server:
    build:
      context: ./mcp_servers/assessment_mcp_server
    ports:
      - "8006:8000"
    environment:
      - ASSESSMENT_SERVICE_URL=http://assessment_service:8000
      - LOCAL_MODE=true
    volumes:
      - ./shared:/app/shared:ro

  learning_course_mcp_server:
    build:
      context: ./mcp_servers/learning_course_mcp_server
    ports:
      - "8007:8000"
    environment:
      - COURSE_SERVICE_URL=http://course_service:8000
      - LEARNING_PROFILE_SERVICE_URL=http://learning_profile_service:8000
      - LOCAL_MODE=true
    volumes:
      - ./shared:/app/shared:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    environment:
      - API_GATEWAY_URL=http://localhost:8080

volumes:
  ollama_data:
