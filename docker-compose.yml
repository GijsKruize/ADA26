version: '3.8'

services:
  course_service:
    build:
      context: ./services/course_service
    ports:
      - "8001:8000"
    env_file:
      - .env.example
    volumes:
      - ./shared:/app/shared:ro

  assessment_service:
    build:
      context: ./services/assessment_service
    ports:
      - "8002:8000"
    env_file:
      - .env.example
    volumes:
      - ./shared:/app/shared:ro

  learning_profile_service:
    build:
      context: ./services/learning_profile_service
    ports:
      - "8003:8000"
    env_file:
      - .env.example
    volumes:
      - ./shared:/app/shared:ro

  auto_grading_agent:
    build:
      context: ./agents/auto_grading_agent
    ports:
      - "8004:8000"
    env_file:
      - .env.example
    volumes:
      - ./shared:/app/shared:ro

  recommender_agent:
    build:
      context: ./agents/recommender_agent
    ports:
      - "8005:8000"
    env_file:
      - .env.example
    volumes:
      - ./shared:/app/shared:ro

  assessment_mcp_server:
    build:
      context: ./mcp_servers/assessment_mcp_server
    ports:
      - "8006:8000"
    env_file:
      - .env.example
    volumes:
      - ./shared:/app/shared:ro

  learning_course_mcp_server:
    build:
      context: ./mcp_servers/learning_course_mcp_server
    ports:
      - "8007:8000"
    env_file:
      - .env.example
    volumes:
      - ./shared:/app/shared:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    env_file:
      - .env.example
    environment:
      - API_GATEWAY_URL=http://localhost:8080

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
